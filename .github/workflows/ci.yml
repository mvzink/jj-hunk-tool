name: CI

# Every push and every PR against main. No matrix: one job, one runner.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Hegel picks its `ci` profile (200 cases per property) by sniffing CI
  # environment variables. That works on GitHub Actions today, but the detector's
  # variable list is an implementation detail of Hegel, so name the profile
  # explicitly: a Hegel upgrade must not be able to silently drop this suite back
  # to the 32-case local default. See hegel.toml for the profile definitions.
  HEGEL_DEFAULT_PROFILE: ci
  # Pinned: the property tests were written against jj 0.44.0, and jj's diff
  # output (rename detection, binary-file rendering) is exactly what they assert
  # on, so CI must not drift to a different jj.
  JJ_VERSION: "0.44.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (clippy + rustfmt)
        # Stable, not pinned: the crate is edition 2024 and its dev-dependency
        # `hegeltest` requires Rust 1.86, both of which any current stable
        # satisfies. `rustc --version` below records what actually ran.
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        # Compiling hegeltest's engine and syntect dominates a cold run; the
        # action's default key covers the lockfile, target dir and rustc version.
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Install jj (pinned release binary)
        run: |
          set -euo pipefail
          url="https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/jj.tar.gz" "$url"
          # Checksum of the v0.44.0 x86_64-linux-musl asset.
          echo "0a07bab4641a55fd2bc2fd1563ba3a3f9a577584086ad74086a1c5b69b3ffce9  $RUNNER_TEMP/jj.tar.gz" | sha256sum -c -
          # The archive carries a "./" entry, so tar restores that directory's mode
          # and mtime; unpacking into a shared directory such as /tmp fails with
          # "Cannot utime: Operation not permitted". Use a directory this job owns.
          mkdir -p "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/jj.tar.gz" -C "$RUNNER_TEMP/jj"
          sudo install -m 0755 "$RUNNER_TEMP/jj/jj" /usr/local/bin/jj
          jj --version

      - name: Check the external commands the tests spawn
        # The property tests run `jj git init` (a *colocated* repo, so the git
        # binary is invoked) and the tool shells out to `patch -p1` for every
        # selection, so all three must exist on the runner.
        run: |
          jj --version
          git --version
          patch --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Nextest's default parallelism is fine: the property tests are
        # subprocess-bound. The case count comes from the `ci` profile (200 per
        # property, 18 properties); nothing here overrides it, so raising it for a
        # one-off is HEGEL_TEST_CASES=... locally.
        #
        # Runtime: ~3 minutes on the 8-core reference box, ~45 s when the suite was
        # six properties. That is still cheap for every push, and the 200 cases are
        # what catch the interesting shapes, so `ci` stays at 200; a scheduled
        # `soak` run (2000 cases, `HEGEL_DEFAULT_PROFILE=soak`) is where depth
        # beyond that belongs. The job timeout is 20 minutes.
        run: cargo nextest run
